[project]
name = "pii-lens"
version = "0.1.0"
description = "Highlight credit cards, emails, phone numbers, SSNs, and US bank numbers in logs and prompts before they hit an LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://counselnode.com"
Repository = "https://github.com/saheb26/pii-lens"
Changelog = "https://github.com/saheb26/pii-lens/releases"

[project.scripts]
pii-lens = "pii_lens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
